databaseChangeLog:
  - changeSet:
      id: 1790112223091-11
      author: daniladotsenko
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: headers
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_error
                  type: TEXT
        - createIndex:
            indexName: idx_outbox_pending
            tableName: outbox_events
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at
