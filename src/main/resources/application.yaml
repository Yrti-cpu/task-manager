spring:
  application:
    name: task-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanager
    username: taskmanager
    password: taskmanager
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

app:
  cache:
    redis:
      enabled: ${APP_CACHE_REDIS_ENABLED:true}
  kafka:
    topics:
      task-events: ${TASK_EVENTS_TOPIC:task-events}
  outbox:
    dispatcher:
      enabled: ${OUTBOX_DISPATCHER_ENABLED:true}
      fixed-delay-ms: ${OUTBOX_DISPATCHER_FIXED_DELAY_MS:5000}
      batch-size: ${OUTBOX_DISPATCHER_BATCH_SIZE:100}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
